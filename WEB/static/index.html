<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>生图</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<div class="app">

  <!-- ==================== 左列：输入 + 任务 ==================== -->
  <div class="col">

    <div class="panel">
      <div class="top">
        <h1>生图</h1>
        <span class="pill" id="mock-pill" hidden>MOCK</span>
        <span class="pill busy" id="busy-pill" hidden></span>
      </div>
    </div>

    <div class="panel">
      <div class="tabs">
        <button id="tab-txt2img" class="on" type="button">文生图</button>
        <button id="tab-img2img" type="button">图生图</button>
      </div>
    </div>

    <div class="panel scroll" style="flex:1">

      <label class="field" id="ref-field">
        <span>参考图（图生图用，顺序会影响模型对「图 1 / 图 2」的理解）</span>
        <div id="drop" class="drop">拖图片进来，或点这里选择（可多选）</div>
        <input id="file-input" type="file" accept="image/*" multiple hidden>
      </label>

      <div class="thumbs" id="thumbs"></div>

      <label class="field">
        <span>提示词</span>
        <textarea id="prompt" placeholder=""></textarea>
      </label>

      <div class="row">
        <label class="field">
          <span>模型线路</span>
          <select id="model"></select>
        </label>
        <label class="field">
          <span>尺寸</span>
          <select id="size"></select>
        </label>
      </div>

      <label class="field">
        <span>输出文件名（可留空；同名会自动加序号，不会覆盖）</span>
        <input id="name" type="text" placeholder="image">
      </label>

      <button class="primary" id="submit" type="button">生成</button>
      <div id="form-err" class="err" hidden style="margin-top:10px"></div>

    </div>

    <div class="panel foot">
      <button class="ghost" id="btn-settings" type="button">⚙ 设置</button>
      <span class="hint" id="foot-hint" hidden></span>
    </div>
  </div>

  <!-- ==================== 右列：任务 + 历史 ==================== -->
  <div class="col">

    <div class="panel scroll" id="tasks-panel" style="flex:1 1 55%">
      <div class="sect-title"><span>任务</span><button class="ghost" id="clear-tasks" type="button">清空已结束</button></div>
      <div id="tasks"><div class="empty">还没有任务</div></div>
    </div>

    <div class="panel scroll" style="flex:1 1 45%">
      <div class="sect-title">
        <span>历史</span>
        <span style="display:flex;gap:6px">
          <button class="ghost" id="hist-more" type="button" hidden>加载更多</button>
          <button class="ghost" id="hist-reload" type="button">刷新</button>
        </span>
      </div>
      <div class="hist" id="hist"></div>
      <div class="empty" id="hist-empty" hidden>还没有图</div>
    </div>

  </div>
</div>

<div class="modal" id="settings-modal">
  <div class="modal-box">
    <div class="modal-head">
      <span>设置</span>
      <button class="ghost" id="settings-close" type="button">✕</button>
    </div>

    <label class="field">
      <span>图片保存位置</span>
      <div class="row tight">
        <input id="set-output-dir" type="text" spellcheck="false" placeholder="留空 = 用默认目录">
        <button class="ghost" id="set-browse" type="button">浏览…</button>
      </div>
      <span class="hint" id="set-output-hint"></span>
    </label>

    <label class="field">
      <span>API key</span>
      <div class="row tight">
        <input id="set-api-key" type="password" autocomplete="off" spellcheck="false">
        <button class="ghost" id="set-key-toggle" type="button">显示</button>
      </div>
      <span class="hint">存在 <code id="set-path"></code>，不进仓库。</span>
    </label>

    <label class="field">
      <span>接口地址（base_url）</span>
      <div class="row tight">
        <input id="set-base-url" type="text" spellcheck="false" placeholder="留空 = 用默认地址">
        <button class="ghost" id="set-reset-url" type="button">恢复默认</button>
      </div>
      <span class="hint" id="set-url-hint"></span>
    </label>

    <div class="err" id="settings-err" hidden></div>

    <div class="row tight" style="justify-content:flex-end;margin-top:14px">
      <button class="ghost" id="set-reset-dir" type="button">恢复默认目录</button>
      <button class="primary" id="settings-save" type="button">保存</button>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox"><img id="lightbox-img" alt=""></div>

<script src="/app.js"></script>
</body>
</html>
